[project]
name = "support-api-judge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["deepeval==4.2.2", "pydantic==2.13.5"]

[dependency-groups]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
  "evaluate_support",
  "judge_collection",
  "judge_errors",
  "judge_runtime",
  "judge_settings",
  "judge_inputs",
  "judge_types",
  "judge_report",
  "openrouter_judge",
  "openrouter_transport",
  "support_grading",
  "request_summary",
  "transcript_evaluation",
  "transcript_report",
]

[tool.mypy]
python_version = "3.12"
files = ["tools/evaluation"]
mypy_path = "tools/evaluation"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["deepeval.*"]
follow_imports = "skip"
