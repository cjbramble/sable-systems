name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests share one group per branch so a new push cancels the old run.
# Each push to main gets its own group: a shared group keeps only one pending
# run and replaces older pending ones, so some main commits would go unchecked.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported minimum (package.json engines, README) and the current
        # version the browser job uses.
        node: [22.13.0, 24.19.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.19
          python-version: 3.12.14
          enable-cache: true
          cache-dependency-glob: tools/evaluation/uv.lock
      - run: npm ci
      - run: npm run setup:judge
      - name: Check offline source, tests, data, and build
        shell: bash
        run: |
          mkdir -p reports/ci
          set -o pipefail
          npm run check 2>&1 | tee reports/ci/offline.log
      - name: Preserve failure output
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: offline-failure-node-${{ matrix.node }}
          path: reports/ci/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build once and run controlled browser journeys
        shell: bash
        run: |
          mkdir -p reports/ci
          set -o pipefail
          npm run test:e2e 2>&1 | tee reports/ci/browser.log
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure
          path: |
            reports/ci/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
