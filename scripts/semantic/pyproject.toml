[project]
name = "support-semantic-evaluator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sentence-transformers==6.0.0",
  "torch==2.13.0",
  "transformers==5.16.1",
  "huggingface-hub==1.29.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
